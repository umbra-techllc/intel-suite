# Rebuilds nfl_propedge_data.json, which nfl_propedge.html loads: the week's games, stats, injuries,
# DraftKings player lines (from ESPN, no key needed), a chance for every posted bet, and the picks.
# The step where Umbra Read chooses the bets needs the ANTHROPIC_API_KEY repository secret; without it
# the board still updates and the picks fall back to the engine's own ranking.
# Runs twice a day, plus Sunday late morning after inactives are announced.
# To run it by hand: Actions tab > NFL PropEdge refresh > Run workflow.
name: NFL PropEdge refresh

on:
  schedule:
    - cron: "17 13 * * *"   # about 9:17am ET every day
    - cron: "17 21 * * *"   # about 5:17pm ET every day
    - cron: "47 15 * * 0"   # about 11:47am ET Sunday, after inactives
  workflow_dispatch:
    inputs:
      week:
        description: "Week to build (leave blank for the current week)"
        required: false

permissions:
  contents: write

concurrency:
  group: nfl-propedge
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install pandas scipy requests lightgbm

      - name: Build the slate
        id: build
        working-directory: nfl-propedge
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          if [ -n "${{ github.event.inputs.week }}" ]; then
            python build_data.py --week "${{ github.event.inputs.week }}"
          else
            python build_data.py
          fi
          code=$?
          set -e
          if [ "$code" = "3" ]; then
            echo "Nothing to build right now, keeping the current board."
            echo "built=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" != "0" ]; then exit "$code"; fi
          echo "built=yes" >> "$GITHUB_OUTPUT"

      - name: Commit the new board
        if: steps.build.outputs.built == 'yes'
        run: |
          git config user.name "umbra-propedge-bot"
          git config user.email "umbra-propedge-bot@users.noreply.github.com"
          git add nfl_propedge_data.json nfl-propedge/data/picks_log.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "NFL PropEdge: refresh slate"
            git pull --rebase origin main
            git push
          fi
