# Retrains the NFL TD Predictor models every Tuesday after Monday night's play-by-play is published.
# To run it by hand: Actions tab > NFL TD Predictor retrain > Run workflow.
name: NFL TD Predictor retrain

on:
  schedule:
    - cron: "43 13 * * 2"   # about 9:43am ET every Tuesday
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-td-retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: pip install pandas numpy pyarrow lightgbm scikit-learn scipy
      - name: Rebuild the training data (every game since 2019, pre-game information only)
        working-directory: nfl-td
        run: python research/build_dataset.py
      - name: Retrain and save the models
        working-directory: nfl-td
        run: python research/fit_td_models.py
      - name: Commit the new models
        run: |
          git config user.name "umbra-propedge-bot"
          git config user.email "umbra-propedge-bot@users.noreply.github.com"
          git add nfl-td/model
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "NFL TD Predictor: weekly model retrain"
            git pull --rebase origin main
            git push
          fi
